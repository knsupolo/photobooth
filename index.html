<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>나만의 네컷 Studio Pro 4.0</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    @import url('https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gaegu:wght@400;700&family=Gowun+Batang:wght@400;700&family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap');

    * { font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { touch-action: manipulation; user-select: none; }
    .mirror { transform: scaleX(-1); }
    @keyframes flashAnim { 0% { opacity: 0.95; } 100% { opacity: 0; } }
    .flash-effect { animation: flashAnim 0.35s ease-out forwards; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @media print {
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea {
        position: fixed; left: 0; top: 0; width: 100vw; height: 100vh;
        display: flex; align-items: center; justify-content: center; background: white;
      }
      #printArea img { max-width: 100%; max-height: 100%; object-fit: contain; }
    }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-start overflow-x-hidden antialiased">

  <input type="file" id="galleryInput" accept="image/*" multiple class="hidden" onchange="handleGalleryUpload(event)">
  <input type="file" id="customFrameInput" accept="image/png" class="hidden" onchange="handleCustomFrameUpload(event)">

  <!-- ========================================================
       화면 1: 메인 홈 포털
  ======================================================== -->
  <main id="screenHome" class="w-full max-w-md flex flex-col min-h-screen px-4 py-5 justify-between">
    <header class="flex items-center justify-between py-2">
      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-rose-500 to-pink-500 flex items-center justify-center shadow-lg shadow-rose-500/20">
          <i data-lucide="camera" class="w-4 h-4 text-white"></i>
        </div>
        <span class="text-lg font-black tracking-tight text-white">나만의 네컷 <span class="text-xs bg-rose-600 px-1.5 py-0.5 rounded-md font-bold ml-1">v4.0</span></span>
      </div>
      <span class="text-xs text-rose-400 font-bold bg-rose-500/10 px-2.5 py-1 rounded-full border border-rose-500/20">
        스튜디오 프로
      </span>
    </header>

    <section class="mt-4 space-y-3">
      <button onclick="openLiveCameraView()" class="w-full bg-gradient-to-r from-rose-600 to-pink-600 hover:from-rose-500 hover:to-pink-500 text-white p-5 rounded-3xl shadow-xl shadow-rose-950/40 flex items-center justify-between active:scale-[0.98] transition group">
        <div class="flex items-center space-x-4 text-left">
          <div class="w-12 h-12 rounded-2xl bg-white/15 flex items-center justify-center text-white group-hover:scale-110 transition">
            <i data-lucide="camera" class="w-6 h-6"></i>
          </div>
          <div>
            <h4 class="font-black text-base text-white">촬영 시작하기</h4>
            <p class="text-xs text-rose-100/80 mt-0.5">촬영 전 필터 선택 + 6컷 촬영</p>
          </div>
        </div>
        <i data-lucide="chevron-right" class="w-5 h-5 text-white/70"></i>
      </button>

      <button onclick="triggerGalleryUpload()" class="w-full bg-slate-900 hover:bg-slate-800/80 border border-slate-800 text-white p-5 rounded-3xl shadow-lg flex items-center justify-between active:scale-[0.98] transition group">
        <div class="flex items-center space-x-4 text-left">
          <div class="w-12 h-12 rounded-2xl bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 group-hover:scale-110 transition">
            <i data-lucide="image" class="w-6 h-6"></i>
          </div>
          <div>
            <h4 class="font-black text-base text-slate-100">앨범에서 선택</h4>
            <p class="text-xs text-slate-400 mt-0.5">보관 중인 사진 4장 불러와 즉시 꾸미기</p>
          </div>
        </div>
        <i data-lucide="chevron-right" class="w-5 h-5 text-slate-500"></i>
      </button>
    </section>

    <div class="mt-4 p-3 bg-slate-900/60 rounded-2xl border border-slate-800/80 flex items-center justify-between text-xs">
      <span class="text-slate-400 font-bold flex items-center space-x-1">
        <i data-lucide="timer" class="w-3.5 h-3.5 text-rose-400"></i>
        <span>타이머 설정</span>
      </span>
      <div class="flex space-x-1.5">
        <button onclick="setTimerSec(3, this)" class="timer-chip bg-rose-600 text-white font-bold px-2.5 py-1 rounded-lg text-[11px]">3초</button>
        <button onclick="setTimerSec(5, this)" class="timer-chip bg-slate-800 text-slate-400 font-bold px-2.5 py-1 rounded-lg text-[11px]">5초</button>
        <button onclick="setTimerSec(7, this)" class="timer-chip bg-slate-800 text-slate-400 font-bold px-2.5 py-1 rounded-lg text-[11px]">7초</button>
      </div>
    </div>

    <footer class="mt-4 text-center text-[11px] text-slate-600">
      MacBook · iPad · iPhone 완벽 호환
    </footer>
  </main>

  <!-- ========================================================
       화면 2: 촬영 전 프리뷰 & 실시간 필터 & 카운트다운 촬영
  ======================================================== -->
  <section id="screenLiveShoot" class="hidden fixed inset-0 bg-black flex flex-col items-center justify-between p-4 z-40">
    <div id="flashOverlay" class="hidden absolute inset-0 bg-white z-50 pointer-events-none"></div>

    <div class="w-full max-w-xl flex items-center justify-between pt-2 px-2 z-10">
      <span id="liveProgressBadge" class="bg-slate-900/90 border border-slate-700 text-slate-300 font-black text-xs px-3.5 py-1.5 rounded-full shadow-lg">
        촬영 준비: 필터를 고르고 촬영을 누르세요
      </span>
      <button onclick="cancelSession()" class="text-slate-400 hover:text-white p-1">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- 카메라 뷰파인더 -->
    <div class="relative w-full max-w-md aspect-[3/4] rounded-3xl overflow-hidden border-2 border-slate-800 shadow-2xl bg-black flex items-center justify-center">
      <video id="liveWebcamVideo" autoplay playsinline muted class="w-full h-full object-cover mirror transition duration-200"></video>
      <div id="liveCountdownBox" class="hidden absolute inset-0 flex items-center justify-center bg-black/20 pointer-events-none">
        <span id="liveCountdownText" class="text-8xl sm:text-9xl font-black text-white drop-shadow-[0_4px_25px_rgba(0,0,0,0.9)]">3</span>
      </div>
    </div>

    <!-- 촬영 전 실시간 필터 바 & 대형 촬영 시작 버튼 -->
    <div class="w-full max-w-md flex flex-col items-center space-y-3 pb-3 z-10">
      <!-- 사전 필터 선택 칩 -->
      <div class="flex items-center space-x-1.5 overflow-x-auto w-full px-2 no-scrollbar py-1">
        <button onclick="setPreShootFilter('normal', this)" class="pre-filter-chip bg-rose-600 text-white font-bold text-xs px-3 py-1.5 rounded-full shrink-0 border border-rose-500">원본</button>
        <button onclick="setPreShootFilter('bright', this)" class="pre-filter-chip bg-slate-900 text-slate-300 font-bold text-xs px-3 py-1.5 rounded-full shrink-0 border border-slate-800">뽀샤시</button>
        <button onclick="setPreShootFilter('warm', this)" class="pre-filter-chip bg-slate-900 text-slate-300 font-bold text-xs px-3 py-1.5 rounded-full shrink-0 border border-slate-800">웜톤</button>
        <button onclick="setPreShootFilter('cool', this)" class="pre-filter-chip bg-slate-900 text-slate-300 font-bold text-xs px-3 py-1.5 rounded-full shrink-0 border border-slate-800">쿨톤</button>
        <button onclick="setPreShootFilter('vintage', this)" class="pre-filter-chip bg-slate-900 text-slate-300 font-bold text-xs px-3 py-1.5 rounded-full shrink-0 border border-slate-800">빈티지</button>
        <button onclick="setPreShootFilter('mono', this)" class="pre-filter-chip bg-slate-900 text-slate-300 font-bold text-xs px-3 py-1.5 rounded-full shrink-0 border border-slate-800">흑백</button>
      </div>

      <!-- 촬영 시작 버튼 -->
      <button onclick="startCountdownShooting()" id="btnStartShoot" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-black py-4 rounded-2xl text-sm flex items-center justify-center space-x-2 shadow-xl active:scale-95 transition">
        <i data-lucide="aperture" class="w-5 h-5"></i>
        <span>📸 6컷 연속 촬영 시작</span>
      </button>

      <!-- 촬영된 썸네일 스트립 -->
      <div id="shootThumbsArea" class="hidden w-full flex items-center justify-center space-x-1.5">
        <div id="liveThumb0" class="w-11 h-14 bg-slate-900 border border-slate-700 rounded-lg overflow-hidden flex items-center justify-center text-[10px] text-slate-500 font-bold">1</div>
        <div id="liveThumb1" class="w-11 h-14 bg-slate-900 border border-slate-700 rounded-lg overflow-hidden flex items-center justify-center text-[10px] text-slate-500 font-bold">2</div>
        <div id="liveThumb2" class="w-11 h-14 bg-slate-900 border border-slate-700 rounded-lg overflow-hidden flex items-center justify-center text-[10px] text-slate-500 font-bold">3</div>
        <div id="liveThumb3" class="w-11 h-14 bg-slate-900 border border-slate-700 rounded-lg overflow-hidden flex items-center justify-center text-[10px] text-slate-500 font-bold">4</div>
        <div id="liveThumb4" class="w-11 h-14 bg-slate-900 border border-slate-700 rounded-lg overflow-hidden flex items-center justify-center text-[10px] text-slate-500 font-bold">5</div>
        <div id="liveThumb5" class="w-11 h-14 bg-slate-900 border border-slate-700 rounded-lg overflow-hidden flex items-center justify-center text-[10px] text-slate-500 font-bold">6</div>
      </div>
    </div>
  </section>

  <!-- ========================================================
       화면 3: 6장 중 4장 선택
  ======================================================== -->
  <section id="screenPick" class="hidden w-full max-w-lg min-h-screen flex flex-col justify-between p-4 text-center">
    <div class="pt-3">
      <span class="bg-rose-500/20 text-rose-400 font-black text-xs px-3 py-1 rounded-full border border-rose-500/30">
        베스트 4장 선택
      </span>
      <h2 class="text-lg font-black text-white mt-2">마음에 드는 사진 4장을 골라주세요</h2>
      <p class="text-xs text-slate-400 mt-1">선택한 순서대로 배치됩니다 (<span id="pickCountText" class="text-rose-400 font-black">0</span>/4)</p>
    </div>

    <div id="pickGrid" class="grid grid-cols-3 gap-2.5 my-auto max-w-md mx-auto w-full px-1"></div>

    <div class="w-full max-w-md mx-auto space-y-2 pb-4">
      <button onclick="confirmSelectedFour()" id="btnConfirmPick" disabled class="w-full bg-rose-600 hover:bg-rose-500 disabled:opacity-30 disabled:pointer-events-none text-white font-extrabold py-3.5 rounded-2xl text-xs flex items-center justify-center space-x-1.5 shadow-lg active:scale-95 transition">
        <i data-lucide="check" class="w-4 h-4"></i>
        <span>이 4장으로 꾸미기</span>
      </button>
      <button onclick="openLiveCameraView()" class="w-full bg-slate-900 hover:bg-slate-800 text-slate-400 font-bold py-2.5 rounded-xl text-xs transition">
        다시 촬영하기
      </button>
    </div>
  </section>

  <!-- ========================================================
       화면 4: 스튜디오 에디터 (사진 드래그 이동 + 프레임 두께/스타일 + 스티커)
  ======================================================== -->
  <section id="screenEdit" class="hidden w-full max-w-6xl min-h-screen flex flex-col lg:flex-row items-center justify-center gap-6 p-3 sm:p-6">
    
    <!-- 좌측 인터랙티브 캔버스 -->
    <div class="flex-1 flex flex-col items-center justify-center w-full max-h-[62vh] lg:max-h-[85vh]">
      <div class="relative max-h-full rounded-2xl shadow-2xl overflow-hidden border border-slate-800 bg-slate-900 p-2 select-none">
        <canvas id="photoCanvas" class="max-h-[55vh] lg:max-h-[78vh] w-auto h-auto object-contain rounded-lg shadow-lg cursor-grab active:cursor-grabbing"></canvas>
      </div>
      <p class="text-[11px] text-slate-400 mt-2 flex items-center space-x-1">
        <i data-lucide="move" class="w-3.5 h-3.5 text-rose-400"></i>
        <span>사진을 드래그하여 얼굴 위치를 맞추거나 스티커를 옮기세요!</span>
      </p>
    </div>

    <!-- 우측 스타일링 컨트롤러 -->
    <div class="w-full lg:w-[440px] bg-slate-900/95 border border-slate-800 rounded-3xl p-5 flex flex-col justify-between space-y-4 shadow-2xl max-h-[88vh] overflow-y-auto no-scrollbar">
      <div>
        <div class="flex items-center justify-between pb-2 border-b border-slate-800">
          <h2 class="text-base font-black text-white flex items-center space-x-2">
            <i data-lucide="sparkles" class="w-4 h-4 text-rose-400"></i>
            <span>네컷 커스텀 스튜디오 v4.0</span>
          </h2>
          <button onclick="cancelSession()" class="text-xs text-slate-500 hover:text-slate-300 font-bold">홈으로</button>
        </div>

        <!-- 4-1. 레이아웃 & 프레임 스타일(액자 꾸미기) -->
        <div class="mt-3">
          <label class="block text-[11px] font-bold text-slate-400 mb-1.5">프레임 레이아웃</label>
          <div class="grid grid-cols-3 gap-1.5">
            <button onclick="changeLayout('strip', this)" class="layout-btn bg-rose-600 text-white font-bold py-2 rounded-xl text-xs flex items-center justify-center space-x-1">
              <i data-lucide="align-justify" class="w-3.5 h-3.5"></i>
              <span>1×4 스트립</span>
            </button>
            <button onclick="changeLayout('grid', this)" class="layout-btn bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2 rounded-xl text-xs flex items-center justify-center space-x-1">
              <i data-lucide="grid" class="w-3.5 h-3.5"></i>
              <span>2×2 격자</span>
            </button>
            <button onclick="changeLayout('twin', this)" class="layout-btn bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2 rounded-xl text-xs flex items-center justify-center space-x-1">
              <i data-lucide="printer" class="w-3.5 h-3.5 text-rose-400"></i>
              <span>2줄 인쇄용 ✂️</span>
            </button>
          </div>
        </div>

        <!-- 4-2. 프레임 액자/꾸미기 스타일 5종 -->
        <div class="mt-3.5">
          <label class="block text-[11px] font-bold text-slate-400 mb-1.5">프레임 테두리 액자 꾸미기</label>
          <div class="grid grid-cols-5 gap-1.5">
            <button onclick="setFrameStyle('solid', this)" class="style-btn bg-rose-600 text-white font-bold py-1.5 rounded-lg text-[11px] border border-rose-500">클래식</button>
            <button onclick="setFrameStyle('film', this)" class="style-btn bg-slate-800 text-slate-300 font-bold py-1.5 rounded-lg text-[11px] border border-transparent">필름 35mm</button>
            <button onclick="setFrameStyle('polaroid', this)" class="style-btn bg-slate-800 text-slate-300 font-bold py-1.5 rounded-lg text-[11px] border border-transparent">폴라로이드</button>
            <button onclick="setFrameStyle('stitch', this)" class="style-btn bg-slate-800 text-slate-300 font-bold py-1.5 rounded-lg text-[11px] border border-transparent">스티치 점선</button>
            <button onclick="setFrameStyle('glow', this)" class="style-btn bg-slate-800 text-slate-300 font-bold py-1.5 rounded-lg text-[11px] border border-transparent">네온 글로우</button>
          </div>
        </div>

        <!-- 4-3. 프레임 두께 조절 슬라이더 (얇게/두껍게) -->
        <div class="mt-3.5 p-3 bg-slate-950/80 rounded-2xl border border-slate-800 space-y-2">
          <div class="flex justify-between text-[11px] font-bold text-slate-400">
            <span>프레임 두께 (여백 조절)</span>
            <span id="valFrameThickness" class="text-rose-400 font-black">보통</span>
          </div>
          <input type="range" id="sliderThickness" min="15" max="75" value="40" oninput="onFrameThicknessChange(this.value)" class="w-full accent-rose-500 h-1.5 bg-slate-800 rounded">
        </div>

        <!-- 4-4. 프레임 색상 (12종) -->
        <div class="mt-3.5">
          <div class="flex items-center justify-between mb-1.5">
            <label class="text-[11px] font-bold text-slate-400">프레임 색상</label>
            <button onclick="document.getElementById('customFrameInput').click()" class="text-[10px] text-rose-400 hover:underline flex items-center space-x-0.5">
              <i data-lucide="upload" class="w-3 h-3"></i>
              <span>투명 PNG 프레임</span>
            </button>
          </div>
          <div class="grid grid-cols-6 gap-2 p-2 bg-slate-950/80 rounded-2xl border border-slate-800">
            <button onclick="changeFrameColor('#111827', this)" class="color-btn w-8 h-8 rounded-full bg-slate-900 border-2 border-rose-500 shadow mx-auto"></button>
            <button onclick="changeFrameColor('#FFFFFF', this)" class="color-btn w-8 h-8 rounded-full bg-white border-2 border-transparent shadow mx-auto"></button>
            <button onclick="changeFrameColor('#E2E8F0', this)" class="color-btn w-8 h-8 rounded-full bg-slate-200 border-2 border-transparent shadow mx-auto"></button>
            <button onclick="changeFrameColor('#334155', this)" class="color-btn w-8 h-8 rounded-full bg-slate-700 border-2 border-transparent shadow mx-auto"></button>
            <button onclick="changeFrameColor('#FECDD3', this)" class="color-btn w-8 h-8 rounded-full bg-rose-200 border-2 border-transparent shadow mx-auto"></button>
            <button onclick="changeFrameColor('#FFEDD5', this)" class="color-btn w-8 h-8 rounded-full bg-orange-100 border-2 border-transparent shadow mx-auto"></button>
            <button onclick="changeFrameColor('#FEF9C3', this)" class="color-btn w-8 h-8 rounded-full bg-yellow-100 border-2 border-transparent shadow mx-auto"></button>
            <button onclick="changeFrameColor('#D1FAE5', this)" class="color-btn w-8 h-8 rounded-full bg-emerald-100 border-2 border-transparent shadow mx-auto"></button>
            <button onclick="changeFrameColor('#BAE6FD', this)" class="color-btn w-8 h-8 rounded-full bg-sky-200 border-2 border-transparent shadow mx-auto"></button>
            <button onclick="changeFrameColor('#EDE9FE', this)" class="color-btn w-8 h-8 rounded-full bg-violet-200 border-2 border-transparent shadow mx-auto"></button>
            <button onclick="changeFrameColor('#881337', this)" class="color-btn w-8 h-8 rounded-full bg-rose-900 border-2 border-transparent shadow mx-auto"></button>
            <button onclick="changeFrameColor('#1E1B4B', this)" class="color-btn w-8 h-8 rounded-full bg-indigo-950 border-2 border-transparent shadow mx-auto"></button>
          </div>
        </div>

        <!-- 4-5. 40종 감성 스티커 -->
        <div class="mt-3.5">
          <div class="flex justify-between items-center mb-1.5">
            <label class="text-[11px] font-bold text-slate-400">감성 스티커 (40종+)</label>
            <button onclick="clearAllStickers()" class="text-[10px] text-rose-400 hover:underline">전체 삭제</button>
          </div>
          <div class="grid grid-cols-8 gap-1 p-2 bg-slate-950/80 rounded-2xl border border-slate-800 text-base max-h-36 overflow-y-auto no-scrollbar">
            <!-- 감성 이모지 & 스탬프 -->
            <button onclick="addEmojiSticker('✌️')" class="p-1 hover:bg-slate-800 rounded">✌️</button>
            <button onclick="addEmojiSticker('💖')" class="p-1 hover:bg-slate-800 rounded">💖</button>
            <button onclick="addEmojiSticker('🎀')" class="p-1 hover:bg-slate-800 rounded">🎀</button>
            <button onclick="addEmojiSticker('🐱')" class="p-1 hover:bg-slate-800 rounded">🐱</button>
            <button onclick="addEmojiSticker('🐶')" class="p-1 hover:bg-slate-800 rounded">🐶</button>
            <button onclick="addEmojiSticker('🐰')" class="p-1 hover:bg-slate-800 rounded">🐰</button>
            <button onclick="addEmojiSticker('🕶️')" class="p-1 hover:bg-slate-800 rounded">🕶️</button>
            <button onclick="addEmojiSticker('✨')" class="p-1 hover:bg-slate-800 rounded">✨</button>
            <button onclick="addEmojiSticker('🎂')" class="p-1 hover:bg-slate-800 rounded">🎂</button>
            <button onclick="addEmojiSticker('👑')" class="p-1 hover:bg-slate-800 rounded">👑</button>
            <button onclick="addEmojiSticker('🎉')" class="p-1 hover:bg-slate-800 rounded">🎉</button>
            <button onclick="addEmojiSticker('🧸')" class="p-1 hover:bg-slate-800 rounded">🧸</button>
            <button onclick="addEmojiSticker('🌸')" class="p-1 hover:bg-slate-800 rounded">🌸</button>
            <button onclick="addEmojiSticker('🍀')" class="p-1 hover:bg-slate-800 rounded">🍀</button>

  <!-- ========================================================
       스튜디오 v4.0 통합 엔진 스크립트
  ======================================================== -->
  <script>
    const GAS_API_URL = "여기에_복사한_웹앱URL_붙여넣기";

    let appState = {
      stream: null,
      timerSec: 3,
      preShootFilter: 'normal',
      shotImages: [],
      selectedImages: [],
      photoPan: [{x:0, y:0}, {x:0, y:0}, {x:0, y:0}, {x:0, y:0}], // 🌟 사진 위치 팬 오프셋
      stickers: [],
      selectedStickerIdx: -1,
      dragTarget: null, // { type: 'sticker'|'photo', index: number }
      dragStartPos: { x:0, y:0 },
      layout: 'strip',
      frameStyle: 'solid', // 'solid'|'film'|'polaroid'|'stitch'|'glow'
      frameThickness: 40,  // 프레임 여백(두께)
      frameColor: '#111827',
      customOverlay: null,
      filters: { bright: 100, contrast: 100, saturate: 100 },
      typography: { fontFamily: 'Pretendard', fontSize: 38, fontColor: '#FFFFFF' },
      resetInterval: null,
      isGeneratingVideo: false
    };

    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    function playBeep(freq = 700) {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
      } catch (e) {}
    }
    function playShutter() {
      try {
        initAudio();
        const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.08, audioCtx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buf;
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        noise.connect(gain); gain.connect(audioCtx.destination);
        noise.start();
      } catch (e) {}
    }

    function setTimerSec(sec, btn) {
      appState.timerSec = sec;
      document.querySelectorAll('.timer-chip').forEach(b => {
        b.className = "timer-chip bg-slate-800 text-slate-400 font-bold px-2.5 py-1 rounded-lg text-[11px]";
      });
      btn.className = "timer-chip bg-rose-600 text-white font-bold px-2.5 py-1 rounded-lg text-[11px]";
    }

    // 1. 촬영 전 카메라 열기 & 사전 필터링
    async function openLiveCameraView() {
      initAudio();
      appState.shotImages = [];
      appState.selectedImages = [];
      document.getElementById('btnStartShoot').classList.remove('hidden');
      document.getElementById('shootThumbsArea').classList.add('hidden');
      document.getElementById('liveProgressBadge').textContent = "촬영 준비: 필터를 고르고 촬영을 누르세요";

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        appState.stream = stream;
        const video = document.getElementById('liveWebcamVideo');
        video.srcObject = stream;
        await video.play();

        applyVideoFilter(appState.preShootFilter);
        showScreen('screenLiveShoot');
      } catch (err) {
        alert("카메라를 실행할 수 없습니다: " + err.name);
      }
    }

    function setPreShootFilter(filterKey, btn) {
      appState.preShootFilter = filterKey;
      document.querySelectorAll('.pre-filter-chip').forEach(b => {
        b.className = "pre-filter-chip bg-slate-900 text-slate-300 font-bold text-xs px-3 py-1.5 rounded-full shrink-0 border border-slate-800";
      });
      btn.className = "pre-filter-chip bg-rose-600 text-white font-bold text-xs px-3 py-1.5 rounded-full shrink-0 border border-rose-500";
      applyVideoFilter(filterKey);
    }

    function applyVideoFilter(filterKey) {
      const video = document.getElementById('liveWebcamVideo');
      if (filterKey === 'bright') {
        video.style.filter = 'brightness(1.15) contrast(1.05) saturate(1.1)';
        appState.filters = { bright: 115, contrast: 105, saturate: 110 };
      } else if (filterKey === 'warm') {
        video.style.filter = 'brightness(1.1) sepia(0.2) saturate(1.2)';
        appState.filters = { bright: 110, contrast: 105, saturate: 125 };
      } else if (filterKey === 'cool') {
        video.style.filter = 'brightness(1.05) hue-rotate(180deg) saturate(0.9)';
        appState.filters = { bright: 105, contrast: 110, saturate: 90 };
      } else if (filterKey === 'vintage') {
        video.style.filter = 'contrast(0.9) sepia(0.3) saturate(0.8)';
        appState.filters = { bright: 105, contrast: 90, saturate: 80 };
      } else if (filterKey === 'mono') {
        video.style.filter = 'grayscale(1) contrast(1.2)';
        appState.filters = { bright: 105, contrast: 125, saturate: 0 };
      } else {
        video.style.filter = 'none';
        appState.filters = { bright: 100, contrast: 100, saturate: 100 };
      }
    }

    // 2. 카운트다운 연속 6컷 촬영
    function startCountdownShooting() {
      document.getElementById('btnStartShoot').classList.add('hidden');
      document.getElementById('shootThumbsArea').classList.remove('hidden');
      for (let i = 0; i < 6; i++) {
        const t = document.getElementById(`liveThumb${i}`);
        t.innerHTML = (i + 1).toString();
        t.className = "w-11 h-14 bg-slate-900 border border-slate-700 rounded-lg overflow-hidden flex items-center justify-center text-[10px] text-slate-500 font-bold";
      }
      runContinuousLiveShoot(0);
    }

    function runContinuousLiveShoot(shotIndex) {
      if (shotIndex >= 6) {
        stopWebcamStream();
        setTimeout(() => { renderPickScreen(); }, 500);
        return;
      }

      document.getElementById('liveProgressBadge').textContent = `${shotIndex + 1} / 6 번째 컷 촬영 중`;
      let count = appState.timerSec;
      const countEl = document.getElementById('liveCountdownText');
      document.getElementById('liveCountdownBox').classList.remove('hidden');
      countEl.textContent = count;
      playBeep(600);

      const interval = setInterval(() => {
        count--;
        if (count > 0) {
          countEl.textContent = count;
          playBeep(600);
        } else {
          clearInterval(interval);
          document.getElementById('liveCountdownBox').classList.add('hidden');
          captureWebcamFrame(shotIndex, () => {
            setTimeout(() => { runContinuousLiveShoot(shotIndex + 1); }, 1800);
          });
        }
      }, 1000);
    }

    function captureWebcamFrame(shotIndex, onDone) {
      playShutter();
      flashScreen();

      const video = document.getElementById('liveWebcamVideo');
      const canvas = document.getElementById('hiddenSnapCanvas');
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;
      const ctx = canvas.getContext('2d');

      ctx.save();
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      ctx.restore();

      const img = new Image();
      img.onload = () => {
        appState.shotImages.push(img);
        const thumb = document.getElementById(`liveThumb${shotIndex}`);
        thumb.innerHTML = `<img src="${img.src}" class="w-full h-full object-cover">`;
        thumb.className = "w-11 h-14 border border-rose-500 rounded-lg overflow-hidden shadow";
        if (onDone) onDone();
      };
      img.src = canvas.toDataURL('image/jpeg', 0.92);
    }

    function flashScreen() {
      const f = document.getElementById('flashOverlay');
      f.classList.remove('hidden');
      f.classList.add('flash-effect');
      setTimeout(() => { f.classList.remove('flash-effect'); f.classList.add('hidden'); }, 350);
    }

    function stopWebcamStream() {
      if (appState.stream) {
        appState.stream.getTracks().forEach(t => t.stop());
        appState.stream = null;
      }
    }

    // 3. 베스트 4장 셀렉터
    function renderPickScreen() {
      showScreen('screenPick');
      appState.selectedImages = [];
      updatePickCounter();

      const grid = document.getElementById('pickGrid');
      grid.innerHTML = '';
      appState.shotImages.forEach((img, idx) => {
        const card = document.createElement('div');
        card.className = "relative aspect-[3/4] rounded-2xl overflow-hidden border-2 border-slate-800 bg-slate-900 cursor-pointer group active:scale-95 transition shadow-md";
        card.id = `pickCard_${idx}`;
        card.innerHTML = `
          <img src="${img.src}" class="w-full h-full object-cover">
          <div id="pickBadge_${idx}" class="hidden absolute top-2 right-2 w-6 h-6 rounded-full bg-rose-600 text-white font-black text-xs flex items-center justify-center shadow-lg border border-white">
            1
          </div>
        `;
        card.onclick = () => toggleSelectPhoto(idx);
        grid.appendChild(card);
      });
    }

    function toggleSelectPhoto(idx) {
      const pos = appState.selectedImages.indexOf(idx);
      if (pos !== -1) {
        appState.selectedImages.splice(pos, 1);
      } else {
        if (appState.selectedImages.length >= 4) return;
        appState.selectedImages.push(idx);
      }
      for (let i = 0; i < appState.shotImages.length; i++) {
        const card = document.getElementById(`pickCard_${i}`);
        const badge = document.getElementById(`pickBadge_${i}`);
        const p = appState.selectedImages.indexOf(i);
        if (p !== -1) {
          card.classList.replace('border-slate-800', 'border-rose-500');
          badge.textContent = (p + 1).toString();
          badge.classList.remove('hidden');
        } else {
          card.classList.replace('border-rose-500', 'border-slate-800');
          badge.classList.add('hidden');
        }
      }
      updatePickCounter();
    }

    function updatePickCounter() {
      const len = appState.selectedImages.length;
      document.getElementById('pickCountText').textContent = len;
      document.getElementById('btnConfirmPick').disabled = (len !== 4);
    }

    function confirmSelectedFour() {
      appState.selectedImages = appState.selectedImages.map(idx => appState.shotImages[idx]);
      appState.photoPan = [{x:0, y:0}, {x:0, y:0}, {x:0, y:0}, {x:0, y:0}];
      showScreen('screenEdit');
      renderStrip();
    }

    function triggerGalleryUpload() {
      const input = document.getElementById('galleryInput');
      input.value = '';
      input.click();
    }

    async function handleGalleryUpload(e) {
      const files = Array.from(e.target.files);
      if (files.length < 4) return alert("최소 4장의 사진을 선택해 주세요!");
      const loaded = await Promise.all(files.slice(0, 4).map(file => {
        return new Promise(res => {
          const r = new FileReader();
          r.onload = ev => {
            const im = new Image();
            im.onload = () => res(im);
            im.src = ev.target.result;
          };
          r.readAsDataURL(file);
        });
      }));
      appState.selectedImages = loaded;
      appState.photoPan = [{x:0, y:0}, {x:0, y:0}, {x:0, y:0}, {x:0, y:0}];
      showScreen('screenEdit');
      renderStrip();
    }

    // 4. 프레임 커스텀 (레이아웃, 스타일, 두께, 색상)
    function changeLayout(mode, btn) {
      appState.layout = mode;
      document.querySelectorAll('.layout-btn').forEach(b => {
        b.className = "layout-btn bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2 rounded-xl text-xs flex items-center justify-center space-x-1";
      });
      btn.className = "layout-btn bg-rose-600 text-white font-bold py-2 rounded-xl text-xs flex items-center justify-center space-x-1";
      renderStrip();
    }

    function setFrameStyle(styleKey, btn) {
      appState.frameStyle = styleKey;
      document.querySelectorAll('.style-btn').forEach(b => {
        b.className = "style-btn bg-slate-800 text-slate-300 font-bold py-1.5 rounded-lg text-[11px] border border-transparent";
      });
      btn.className = "style-btn bg-rose-600 text-white font-bold py-1.5 rounded-lg text-[11px] border border-rose-500";
      renderStrip();
    }

    function onFrameThicknessChange(val) {
      appState.frameThickness = parseInt(val);
      const label = document.getElementById('valFrameThickness');
      if (val < 25) label.textContent = "아주 얇게";
      else if (val < 45) label.textContent = "보통";
      else label.textContent = "두껍게";
      renderStrip();
    }

    function changeFrameColor(color, btn) {
      appState.frameColor = color;
      document.querySelectorAll('.color-btn').forEach(b => b.classList.replace('border-rose-500', 'border-transparent'));
      if (btn) btn.classList.replace('border-transparent', 'border-rose-500');

      if (['#FFFFFF','#E2E8F0','#FECDD3','#FFEDD5','#FEF9C3','#D1FAE5','#BAE6FD','#EDE9FE'].includes(color)) {
        appState.typography.fontColor = '#1E293B';
      } else {
        appState.typography.fontColor = '#FFFFFF';
      }
      renderStrip();
    }

    function handleCustomFrameUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const r = new FileReader();
      r.onload = ev => {
        const im = new Image();
        im.onload = () => {
          appState.customOverlay = im;
          renderStrip();
          alert("투명 PNG 프레임이 적용되었습니다!");
        };
        im.src = ev.target.result;
      };
      r.readAsDataURL(file);
    }

    function setFontFamily(fontName, btn) {
      appState.typography.fontFamily = fontName;
      document.querySelectorAll('.font-btn').forEach(b => {
        b.classList.replace('border-rose-500', 'border-transparent');
        b.classList.replace('text-white', 'text-slate-300');
      });
      btn.classList.replace('border-transparent', 'border-rose-500');
      btn.classList.replace('text-slate-300', 'text-white');
      renderStrip();
    }

    // 5. 스티커 인터랙션
    function addEmojiSticker(emoji) {
      const canvas = document.getElementById('photoCanvas');
      const newSticker = {
        id: Date.now(),
        text: emoji,
        x: canvas.width / 2 + (Math.random() * 80 - 40),
        y: canvas.height - 220 + (Math.random() * 60 - 30),
        size: 70
      };
      appState.stickers.push(newSticker);
      appState.selectedStickerIdx = appState.stickers.length - 1;
      showStickerControls(newSticker);
      renderStrip();
    }

    function clearAllStickers() {
      appState.stickers = [];
      appState.selectedStickerIdx = -1;
      document.getElementById('stickerControlBar').classList.add('hidden');
      renderStrip();
    }

    function showStickerControls(st) {
      const bar = document.getElementById('stickerControlBar');
      bar.classList.remove('hidden');
      document.getElementById('stickerSizeSlider').value = st.size;
    }

    function onSelectedStickerResize(size) {
      if (appState.selectedStickerIdx >= 0 && appState.selectedStickerIdx < appState.stickers.length) {
        appState.stickers[appState.selectedStickerIdx].size = parseInt(size);
        renderStrip();
      }
    }

    function deleteSelectedSticker() {
      if (appState.selectedStickerIdx >= 0) {
        appState.stickers.splice(appState.selectedStickerIdx, 1);
        appState.selectedStickerIdx = -1;
        document.getElementById('stickerControlBar').classList.add('hidden');
        renderStrip();
      }
    }

    // 6. 캔버스 마우스/터치 드래그 (사진 이동 & 스티커 이동 통합)
    let slotBoxes = []; // 렌더링 시 사진 슬롯 좌표 기록 [{x, y, w, h}]

    function initCanvasInteractions() {
      const canvas = document.getElementById('photoCanvas');

      function getCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: (clientX - rect.left) * (canvas.width / rect.width),
          y: (clientY - rect.top) * (canvas.height / rect.height)
        };
      }

      function handleStart(e) {
        const c = getCoords(e);

        // 1) 스티커 히트 테스트
        for (let i = appState.stickers.length - 1; i >= 0; i--) {
          const st = appState.stickers[i];
          if (Math.hypot(c.x - st.x, c.y - st.y) <= st.size * 0.7) {
            appState.selectedStickerIdx = i;
            appState.dragTarget = { type: 'sticker', index: i };
            appState.dragStartPos = { x: c.x - st.x, y: c.y - st.y };
            showStickerControls(st);
            renderStrip();
            return;
          }
        }
        appState.selectedStickerIdx = -1;
        document.getElementById('stickerControlBar').classList.add('hidden');

        // 2) 🌟 사진 슬롯 히트 테스트 (사진 이동)
        for (let s = 0; s < slotBoxes.length; s++) {
          const box = slotBoxes[s];
          if (c.x >= box.x && c.x <= box.x + box.w && c.y >= box.y && c.y <= box.y + box.h) {
            appState.dragTarget = { type: 'photo', index: s };
            appState.dragStartPos = {
              startX: c.x,
              startY: c.y,
              initPanX: appState.photoPan[s].x,
              initPanY: appState.photoPan[s].y
            };
            return;
          }
        }

        appState.dragTarget = null;
        renderStrip();
      }

      function handleMove(e) {
        if (!appState.dragTarget) return;
        e.preventDefault();
        const c = getCoords(e);

        if (appState.dragTarget.type === 'sticker') {
          const st = appState.stickers[appState.dragTarget.index];
          st.x = c.x - appState.dragStartPos.x;
          st.y = c.y - appState.dragStartPos.y;
          renderStrip();
        } else if (appState.dragTarget.type === 'photo') {
          // 사진 위치 팬 드래그
          const idx = appState.dragTarget.index;
          const dx = c.x - appState.dragStartPos.startX;
          const dy = c.y - appState.dragStartPos.startY;
          appState.photoPan[idx].x = appState.dragStartPos.initPanX + dx;
          appState.photoPan[idx].y = appState.dragStartPos.initPanY + dy;
          renderStrip();
        }
      }

      function handleEnd() {
        appState.dragTarget = null;
      }

      canvas.addEventListener('mousedown', handleStart);
      window.addEventListener('mousemove', handleMove);
      window.addEventListener('mouseup', handleEnd);
      canvas.addEventListener('touchstart', handleStart, { passive: false });
      window.addEventListener('touchmove', handleMove, { passive: false });
      window.addEventListener('touchend', handleEnd);
    }

    // 7. 메인 캔버스 렌더링 루프 (액자 스타일 & 두께 & 사진 이동 반영)
    function renderStrip(isFinalExport = false) {
      const canvas = document.getElementById('photoCanvas');
      const ctx = canvas.getContext('2d');
      if (appState.selectedImages.length < 4) return;

      const layout = appState.layout;
      const sig = document.getElementById('frameSignature').value || 'MY 4-CUT STUDIO';
      const pad = appState.frameThickness;
      const gap = Math.round(pad * 0.6);
      slotBoxes = [];

      if (layout === 'strip') {
        canvas.width = 800; canvas.height = 2400;
      } else if (layout === 'grid') {
        canvas.width = 1400; canvas.height = 1800;
      } else if (layout === 'twin') {
        canvas.width = 1200; canvas.height = 1800;
      }

      // 배경 채우기
      ctx.fillStyle = appState.frameColor;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 프레임 액자 데코 스타일 (Glow / Film / Polaroid / Stitch)
      if (appState.frameStyle === 'glow') {
        ctx.save();
        ctx.strokeStyle = '#F43F5E';
        ctx.lineWidth = 12;
        ctx.shadowColor = '#FB7185';
        ctx.shadowBlur = 24;
        ctx.strokeRect(6, 6, canvas.width - 12, canvas.height - 12);
        ctx.restore();
      }

      if (layout === 'strip') {
        const imgW = canvas.width - (pad * 2);
        const imgH = 480;
        for (let i = 0; i < 4; i++) {
          const y = pad + i * (imgH + gap);
          slotBoxes.push({ x: pad, y: y, w: imgW, h: imgH });
          drawCroppedSlotPhoto(ctx, appState.selectedImages[i], pad, y, imgW, imgH, appState.photoPan[i]);
        }
        drawFooterTypography(ctx, canvas.width / 2, pad + 4 * (imgH + gap) + 110, sig);

      } else if (layout === 'grid') {
        const imgW = (canvas.width - (pad * 2) - gap) / 2;
        const imgH = 680;
        const coords = [
          { x: pad, y: pad }, { x: pad + imgW + gap, y: pad },
          { x: pad, y: pad + imgH + gap }, { x: pad + imgW + gap, y: pad + imgH + gap }
        ];
        for (let i = 0; i < 4; i++) {
          slotBoxes.push({ x: coords[i].x, y: coords[i].y, w: imgW, h: imgH });
          drawCroppedSlotPhoto(ctx, appState.selectedImages[i], coords[i].x, coords[i].y, imgW, imgH, appState.photoPan[i]);
        }
        drawFooterTypography(ctx, canvas.width / 2, pad + (imgH * 2) + gap + 110, sig);

      } else if (layout === 'twin') {
        const padX = pad * 0.7;
        const stripW = (canvas.width / 2) - 40;
        const imgH = 340;

        for (let i = 0; i < 4; i++) {
          const y = pad + i * (imgH + gap);
          slotBoxes.push({ x: padX, y: y, w: stripW - (padX * 2), h: imgH });
          drawCroppedSlotPhoto(ctx, appState.selectedImages[i], padX, y, stripW - (padX * 2), imgH, appState.photoPan[i]);
        }
        drawFooterTypography(ctx, stripW / 2 + 10, pad + 4 * (imgH + gap) + 85, sig, 26);

        const rightOffsetX = canvas.width / 2 + 15;
        for (let i = 0; i < 4; i++) {
          const y = pad + i * (imgH + gap);
          drawCroppedSlotPhoto(ctx, appState.selectedImages[i], rightOffsetX + padX, y, stripW - (padX * 2), imgH, appState.photoPan[i]);
        }
        drawFooterTypography(ctx, rightOffsetX + (stripW / 2) - 10, pad + 4 * (imgH + gap) + 85, sig, 26);

        // 절취선
        ctx.save();
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 8]);
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, 20);
        ctx.lineTo(canvas.width / 2, canvas.height - 20);
        ctx.stroke();
        ctx.font = '22px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('✂️', canvas.width / 2, canvas.height / 2);
        ctx.restore();
      }

      // 스티치 테두리 데코
      if (appState.frameStyle === 'stitch') {
        ctx.save();
        ctx.strokeStyle = 'rgba(255,255,255,0.7)';
        ctx.lineWidth = 3;
        ctx.setLineDash([10, 8]);
        slotBoxes.forEach(b => {
          ctx.strokeRect(b.x - 4, b.y - 4, b.w + 8, b.h + 8);
        });
        ctx.restore();
      }

      // 필름 카메라 천공 구멍 데코
      if (appState.frameStyle === 'film') {
        ctx.save();
        ctx.fillStyle = '#FFFFFF';
        const holeW = 12, holeH = 18, holeGap = 24;
        for (let y = 30; y < canvas.height - 30; y += holeGap) {
          ctx.fillRect(8, y, holeW, holeH);
          ctx.fillRect(canvas.width - 20, y, holeW, holeH);
        }
        ctx.restore();
      }

      if (appState.customOverlay) {
        ctx.drawImage(appState.customOverlay, 0, 0, canvas.width, canvas.height);
      }

      // 스티커 드로잉
      appState.stickers.forEach((st, idx) => {
        ctx.save();
        ctx.font = `${st.size}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(st.text, st.x, st.y);

        if (!isFinalExport && idx === appState.selectedStickerIdx) {
          ctx.strokeStyle = '#F43F5E';
          ctx.lineWidth = 3;
          ctx.setLineDash([6, 6]);
          const radius = st.size * 0.65;
          ctx.strokeRect(st.x - radius, st.y - radius, radius * 2, radius * 2);
        }
        ctx.restore();
      });
    }

    // 🌟 사진 위치 이동(Pan)을 반영한 마스킹 크롭 드로잉
    function drawCroppedSlotPhoto(ctx, img, targetX, targetY, targetW, targetH, panOffset) {
      ctx.save();
      // 프레임 영역 마스킹 (사진이 슬롯 바깥으로 삐져나가지 않도록 클리핑)
      ctx.beginPath();
      ctx.rect(targetX, targetY, targetW, targetH);
      ctx.clip();

      const srcRatio = img.width / img.height;
      const targetRatio = targetW / targetH;
      let renderW, renderH;

      if (srcRatio > targetRatio) {
        renderH = targetH;
        renderW = targetH * srcRatio;
      } else {
        renderW = targetW;
        renderH = targetW / srcRatio;
      }

      // 기본 중앙 정렬 + 사용자 팬 이동 오프셋
      const drawX = targetX + (targetW - renderW) / 2 + (panOffset ? panOffset.x : 0);
      const drawY = targetY + (targetH - renderH) / 2 + (panOffset ? panOffset.y : 0);

      const off = document.createElement('canvas');
      off.width = renderW; off.height = renderH;
      const offCtx = off.getContext('2d');
      offCtx.filter = `brightness(${appState.filters.bright}%) contrast(${appState.filters.contrast}%) saturate(${appState.filters.saturate}%)`;
      offCtx.drawImage(img, 0, 0, renderW, renderH);

      ctx.drawImage(off, drawX, drawY);
      ctx.restore();
    }

    function drawFooterTypography(ctx, x, y, title, customSize = null) {
      const size = customSize || appState.typography.fontSize;
      ctx.textAlign = 'center';
      ctx.fillStyle = appState.typography.fontColor;
      ctx.font = `bold ${size}px '${appState.typography.fontFamily}', sans-serif`;
      ctx.fillText(title, x, y);

      ctx.font = `bold ${Math.round(size * 0.55)}px '${appState.typography.fontFamily}', sans-serif`;
      ctx.globalAlpha = 0.7;
      ctx.fillText(getTodayDate(), x, y + Math.round(size * 0.85));
      ctx.globalAlpha = 1.0;
    }

    function getTodayDate() {
      const d = new Date();
      return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
    }

    // 8. 🌟 [편집창 전용] 움직이는 네컷 비디오 생성 (Live Motion)
    async function generateMotionVideo(btnEl) {
      if (appState.isGeneratingVideo) return;
      appState.isGeneratingVideo = true;

      const btn = btnEl || document.getElementById('btnEditorVideo');
      const origHtml = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>비디오 생성 중 (3초)...</span>`;
      lucide.createIcons();

      const motionCanvas = document.createElement('canvas');
      motionCanvas.width = 720;
      motionCanvas.height = 1080;
      const mCtx = motionCanvas.getContext('2d');

      const stream = motionCanvas.captureStream(30);
      let recorder;
      try {
        recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
      } catch (e) {
        recorder = new MediaRecorder(stream);
      }

      const chunks = [];
      recorder.ondataavailable = e => chunks.push(e.data);
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `My4Cut_Motion_${Date.now()}.webm`;
        a.click();
        btn.disabled = false;
        btn.innerHTML = origHtml;
        appState.isGeneratingVideo = false;
        lucide.createIcons();
      };

      recorder.start();

      const durationPerCut = 800; // 1컷당 0.8초씩 총 3.2초 렌더링
      const startTime = performance.now();

      function animate(time) {
        const elapsed = time - startTime;
        const cutIdx = Math.min(3, Math.floor(elapsed / durationPerCut));
        const progress = (elapsed % durationPerCut) / durationPerCut;

        mCtx.fillStyle = appState.frameColor;
        mCtx.fillRect(0, 0, motionCanvas.width, motionCanvas.height);

        const zoom = 1.0 + progress * 0.08;
        const img = appState.selectedImages[cutIdx];

        mCtx.save();
        mCtx.translate(motionCanvas.width / 2, motionCanvas.height / 2);
        mCtx.scale(zoom, zoom);
        mCtx.filter = `brightness(${appState.filters.bright}%) contrast(${appState.filters.contrast}%) saturate(${appState.filters.saturate}%)`;
        mCtx.drawImage(img, -270, -370, 540, 740);
        mCtx.restore();

        mCtx.fillStyle = '#FFFFFF';
        mCtx.font = 'bold 30px Pretendard, sans-serif';
        mCtx.textAlign = 'center';
        mCtx.fillText(`CUT ${cutIdx + 1} / 4`, motionCanvas.width / 2, 85);
        mCtx.font = 'bold 22px Pretendard, sans-serif';
        mCtx.fillText(document.getElementById('frameSignature').value || 'MY 4-CUT STUDIO', motionCanvas.width / 2, motionCanvas.height - 55);

        if (elapsed < 3200) {
          requestAnimationFrame(animate);
        } else {
          recorder.stop();
        }
      }
      requestAnimationFrame(animate);
    }

    // 9. 구글 드라이브 업로드 & QR코드 안전 렌더링
    function saveAndGenerateQR() {
      const btn = document.getElementById('btnSaveQR');
      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>저장 중...</span>`;
      lucide.createIcons();

      renderStrip(true);
      const canvas = document.getElementById('photoCanvas');
      const base64Data = canvas.toDataURL('image/png');

      fetch(GAS_API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({
          base64Data: base64Data,
          layout: appState.layout,
          frameColor: appState.frameColor
        })
      })
      .then(res => res.json())
      .then(res => {
        btn.disabled = false;
        btn.innerHTML = `<span>완성본 드라이브 저장 & QR코드</span>`;
        if (res && res.success) {
          displayResultWithQR(res.fileUrl);
        } else {
          fallbackLocalDownload();
        }
      })
      .catch(err => {
        btn.disabled = false;
        btn.innerHTML = `<span>완성본 드라이브 저장 & QR코드</span>`;
        fallbackLocalDownload();
      });
    }

    function displayResultWithQR(url) {
      const qrBox = document.getElementById('qrcodeArea');
      qrBox.innerHTML = '';
      new QRCode(qrBox, { text: url, width: 170, height: 170 });
      showScreen('screenResult');
      startAutoReset();
    }

    function fallbackLocalDownload() {
      const currentUrl = window.location.href;
      displayResultWithQR(currentUrl);
      downloadLocalImage();
    }

    function shareViaAirDrop() {
      renderStrip(true);
      const canvas = document.getElementById('photoCanvas');
      canvas.toBlob(blob => {
        if (!blob) return;
        const file = new File([blob], `My4Cut_${Date.now()}.png`, { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: '나만의 네컷' });
        } else {
          downloadLocalImage();
        }
      }, 'image/png');
    }

    function downloadLocalImage() {
      renderStrip(true);
      const canvas = document.getElementById('photoCanvas');
      const a = document.createElement('a');
      a.download = `My4Cut_${Date.now()}.png`;
      a.href = canvas.toDataURL('image/png');
      a.click();
    }

    function triggerPrintMode() {
      renderStrip(true);
      const canvas = document.getElementById('photoCanvas');
      const printArea = document.getElementById('printArea');
      printArea.innerHTML = `<img src="${canvas.toDataURL('image/png')}">`;
      printArea.classList.remove('hidden');
      window.print();
      setTimeout(() => { printArea.classList.add('hidden'); }, 1000);
    }

    // 10. 화면 전환 & 초기화
    function showScreen(id) {
      ['screenHome', 'screenLiveShoot', 'screenPick', 'screenEdit', 'screenResult'].forEach(s => {
        document.getElementById(s).classList.toggle('hidden', s !== id);
      });
      lucide.createIcons();
    }

    function cancelSession() { stopWebcamStream(); resetApp(); }

    function resetApp() {
      if (appState.resetInterval) clearInterval(appState.resetInterval);
      stopWebcamStream();
      appState.shotImages = [];
      appState.selectedImages = [];
      appState.photoPan = [{x:0, y:0}, {x:0, y:0}, {x:0, y:0}, {x:0, y:0}];
      appState.stickers = [];
      appState.selectedStickerIdx = -1;
      showScreen('screenHome');
    }

    function startAutoReset() {
      if (appState.resetInterval) clearInterval(appState.resetInterval);
      let sec = 60;
      const txt = document.getElementById('resetTimerText');
      txt.textContent = `${sec}초`;
      appState.resetInterval = setInterval(() => {
        // 비디오 다운로드 중에는 카운터 정지
        if (appState.isGeneratingVideo) return;
        sec--;
        txt.textContent = `${sec}초`;
        if (sec <= 0) {
          clearInterval(appState.resetInterval);
          resetApp();
        }
      }, 1000);
    }

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      initCanvasInteractions();
    });
  </script>
